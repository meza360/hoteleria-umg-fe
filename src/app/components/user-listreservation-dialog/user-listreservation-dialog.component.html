<div class="container-md text-center px-2">
  <div class="col align-center full-width text-center py-3 px-3 my-2">
    <form [formGroup]="clientForm" class="full-width mx-3 px-3 login-form">
      <section class="col full-width text-center">
        <mat-form-field appearance="fill" class="form-control">
          <mat-label class="form-label">Correo Electrónico</mat-label>
          <input matInput formControlName="email" class="form-control" placeholder="Ingresa tu correo electrónico">
          <mat-error *ngIf="clientForm.get('email')?.touched && clientForm.get('email')?.errors?.['required']">
            El correo electrónico es requerido.
          </mat-error>
          <mat-error *ngIf="clientForm.get('email')?.touched && clientForm.get('email')?.errors?.['email']">
            Ingresa un correo electrónico válido.
          </mat-error>
        </mat-form-field>
      </section>

    </form>
  </div>
  <div *ngIf="isLoading$ | async; else reservationsTable"></div>
  <div class="container-md text-center text-white">
    <ng-template #reservationsTable>
      <section>
        <table mat-table class="full-width-table table-primary-container" matSort aria-label="Elements"
               *ngIf="dataSource.data.length != 0 && !(isLoading$ | async)" [dataSource]="dataSource">
          <!-- Id Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="">Id</th>
            <td mat-cell *matCellDef="let row" class="">{{row.id}}</td>
          </ng-container>
          <ng-container matColumnDef="room">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="">Habitacion</th>
            <td mat-cell *matCellDef="let row" class="">{{row.room.name}}</td>
          </ng-container>
          <ng-container matColumnDef="nights">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="">Noches</th>
            <td mat-cell *matCellDef="let row" class="">{{row.room.totalNights}}</td>
          </ng-container>
          <ng-container matColumnDef="total">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="">Total</th>
            <td mat-cell *matCellDef="let row" class="">
              {{row.payment.total | currency}}
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class=""></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class=""></tr>
        </table>
        <mat-paginator *ngIf="dataSource.data.length != 0 && !(isLoading$ | async)" #paginator
                       [length]="dataSource.data.length" [pageIndex]="0" [pageSize]="10" role="application"
                       class="paginator-primary-container " [pageSizeOptions]="[5, 10, 20]" aria-label="Select page">
        </mat-paginator>
      </section>
    </ng-template>
  </div>
  <div class="col align-center full-width text-center py-3 px-3 my-2">
    <section class="full-width text-center col space-between">
      <!--  <mat-dialog-actions class="mt-4"> -->
      <button mat-flat-button [disabled]="clientForm.invalid" color="primary" (click)="searchRooms()"
              class="full-width form-control my-2">
        Buscar
      </button>
      <button mat-flat-button [matDialogClose]="null" color="primary" class="full-width form-control my-2">
        Cerrar
      </button>
      <!-- </mat-dialog-actions> -->
    </section>
  </div>

</div>
