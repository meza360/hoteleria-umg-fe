<div class="container-md">
  <!-- Header de pagina -->
  <section class="row-c space-between align-items-center my-3">
    <span>
      <h3 class="display-medium primary-fixed-text">Reservaciones del sistema</h3>
      <p class="title-medium primary-fixed-text">Visualiza de forma tabular las reservaciones en el sistema</p>
    </span>
    <span>
      <button type="button" mat-button [routerLink]="['newReservation']"
              class="on-tertiary-fixed tertiary-fixed-text row-c align-items-center py-3 px-3 m3-elevation rounded-4">
        <mat-icon class="material-symbols-outlined" fontIcon="mode_edit"></mat-icon>
        Ingresar reservacion
      </button>
    </span>
  </section>
  <mat-spinner *ngIf="isLoading$ | async; else reservationsTable"></mat-spinner>
  <ng-template #reservationsTable>
    <section>
      <table mat-table class="full-width-table table-primary-container" matSort aria-label="Elements"
             *ngIf="dataSource.data.length != 0 && !(isLoading$ | async)" [dataSource]="dataSource">
        <!-- Id Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="">Id</th>
          <td mat-cell *matCellDef="let row" class="">{{row.id}}</td>
        </ng-container>
        <ng-container matColumnDef="guest">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="">Huesped</th>
          <td mat-cell *matCellDef="let row" class="">{{row.billTo.name}}</td>
        </ng-container>
        <ng-container matColumnDef="nights">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="">Noches</th>
          <td mat-cell *matCellDef="let row" class="">{{row.room.totalNights}}</td>
        </ng-container>
        <ng-container matColumnDef="options">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="">Opciones</th>
          <td mat-cell *matCellDef="let row" class="">
            <button mat-button type="button" [matMenuTriggerFor]="menu" role="button"
                    class="no-border primary-container">
              <mat-icon class="">more_horiz</mat-icon>
            </button>
            <mat-menu #menu>
              <button mat-menu-item class="">Eliminar</button>
              <button mat-menu-item class="" [routerLink]="[ row.id]">
                Ver detalles
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class=""></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class=""></tr>
      </table>
      <mat-paginator *ngIf="dataSource.data.length != 0 && !(isLoading$ | async)" #paginator
                     [length]="dataSource.data.length" [pageIndex]="0" [pageSize]="10" role="application"
                     class="paginator-primary-container " [pageSizeOptions]="[5, 10, 20]" aria-label="Select page">
      </mat-paginator>
    </section>
  </ng-template>
</div>
